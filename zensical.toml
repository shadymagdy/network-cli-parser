# Documentation site, built with Zensical (https://zensical.org), the successor of Material for MkDocs.
#   uv run --group docs zensical serve     # live preview at http://127.0.0.1:8000
#   uv run --group docs zensical build     # static site in site/

[project]
site_name = "clijson"
site_description = "Turn show/display command output from Cisco IOS XR, Juniper Junos and Huawei VRP routers into JSON."
site_author = "Shady Magdy"
site_url = "https://shadymagdy.github.io/network-cli-parser/"
repo_url = "https://github.com/shadymagdy/network-cli-parser"
repo_name = "shadymagdy/network-cli-parser"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Copyright &copy; Shady Magdy &mdash; MIT License"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "User guide" = [
    { "Command line" = "cli.md" },
    { "Supported commands" = "commands.md" },
    { "Normalized models" = "models.md" },
    { "AI assistants (MCP)" = "mcp.md" },
  ] },
  { "Guides" = [
    { "Pseudowire redundancy checks" = "guides/pseudowire-checks.md" },
    { "Using clijson in Cisco NSO" = "guides/cisco-nso.md" },
  ] },
  { "Developer guide" = [
    { "Architecture" = "architecture.md" },
    { "Writing parsers" = "writing-parsers.md" },
    { "Contributing" = "contributing.md" },
  ] },
  { "API reference" = [
    { "Python API" = "reference/api.md" },
    { "Models" = "reference/models.md" },
    { "Parser helpers" = "reference/textutils.md" },
    { "MCP server" = "reference/mcp.md" },
    { "Cisco NSO" = "reference/nso.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
icon.repo = "fontawesome/brands/github"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
show_root_heading = true
show_root_full_path = false
show_source = false
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
members_order = "source"
