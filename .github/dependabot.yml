# Keeps pinned GitHub Actions SHAs and the uv lockfile current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
    ignore:
      # scrapli 2.x (2026.10+) is a rewrite with a new API; clijson.live supports scrapli 1.x
      - dependency-name: scrapli
        versions: [">=2026.10"]
    commit-message:
      prefix: build
